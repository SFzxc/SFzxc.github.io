<button class="theme-toggle" type="button" aria-label="Chế độ tối" aria-pressed="false" title="Đổi nền sáng / tối">
  <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
  <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
<script>
(function(){
  var root=document.documentElement, btn=document.currentScript.previousElementSibling,
      mq=window.matchMedia('(prefers-color-scheme: dark)');
  function mode(){return root.getAttribute('data-theme')||(mq.matches?'dark':'light')}
  function sync(){btn.setAttribute('aria-pressed',mode()==='dark'?'true':'false')}
  btn.addEventListener('click',function(){
    var next=mode()==='dark'?'light':'dark';
    root.setAttribute('data-theme',next);
    try{localStorage.setItem('theme',next)}catch(e){}
    sync();
  });
  if(mq.addEventListener)mq.addEventListener('change',sync);
  sync();
})();
</script>
